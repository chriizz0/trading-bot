name: Research EXP-101
on:
  workflow_dispatch:
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TBOT_MODE: ${{ vars.TBOT_MODE || 'paper' }}
      TBOT_LIVE_CONFIRM: ${{ secrets.TBOT_LIVE_CONFIRM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python scripts/fetch_data.py --symbols SPY EFA IEF AGG VNQ DBC BIL --start 2000-01-01
      - run: python scripts/research.py
      - run: bash .github/workflows/_commit.sh data/raw reports
        env: { COMMIT_MSG: "research: EXP-101 Daten + Ergebnis" }
