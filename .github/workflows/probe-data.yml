name: Probe Datenquellen
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q pandas && mkdir -p reports && python scripts/probe_dukascopy.py 2>&1 | tee reports/probe-data.log
      - if: always()
        run: bash .github/workflows/_commit.sh reports
        env: { COMMIT_MSG: "probe: Dukascopy-Timing" }
