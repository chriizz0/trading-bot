name: Research EXP-201 (Intraday)
on: { workflow_dispatch: }
concurrency: { group: exp201, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - uses: actions/cache@v4
        with:
          path: data/intraday/histdata
          key: histdata-m30-v1-${{ github.run_id }}
          restore-keys: histdata-m30-v1-
      - name: HistData laden (1 Min -> 30 Min) und auswerten
        shell: bash
        run: |
          set -o pipefail; mkdir -p reports
          python scripts/fetch_histdata.py 2>&1 | tee reports/exp201-fetch.log
          python scripts/research_intraday.py 2>&1 | tee -a reports/exp201-fetch.log
      - if: always()
        run: bash .github/workflows/_commit.sh reports
        env: { COMMIT_MSG: "research: EXP-201 Ergebnis (HistData)" }
