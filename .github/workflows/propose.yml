name: 1 Vorschlag nach Börsenschluss
on:
  schedule: [{ cron: "15 22 * * 1-5" }]
  workflow_dispatch:
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TBOT_MODE: ${{ vars.TBOT_MODE || 'paper' }}
      TBOT_LIVE_CONFIRM: ${{ secrets.TBOT_LIVE_CONFIRM }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python scripts/propose.py
      - if: always()
        run: bash .github/workflows/_commit.sh proposals journal
        env: { COMMIT_MSG: "bot: Vorschlag" }
