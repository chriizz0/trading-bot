name: EXP-401 Snapshot + Auswertung
on:
  schedule:
    - cron: "0 9 * * 6"
  workflow_dispatch:
concurrency:
  group: repo-write
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python scripts/exp401.py snapshot
      - run: python scripts/exp401.py score
      - name: ChatGPT-Gegenspieler (nur mit Secret OPENAI_API_KEY)
        run: python scripts/exp401_rival.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      - run: python scripts/dashboard.py
      - if: always()
        run: bash .github/workflows/_commit.sh reports/exp401 predictions/exp401-chatgpt docs
        env:
          COMMIT_MSG: "exp401: Snapshot und Auswertung"
