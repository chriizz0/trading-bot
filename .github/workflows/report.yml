name: 3 Wochenbericht
on:
  schedule: [{ cron: "0 8 * * 6" }]
  workflow_dispatch:
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TBOT_MODE: ${{ vars.TBOT_MODE || 'paper' }}
      TBOT_LIVE_CONFIRM: ${{ secrets.TBOT_LIVE_CONFIRM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python scripts/report.py
      - run: bash .github/workflows/_commit.sh reports
        env: { COMMIT_MSG: "bot: Wochenbericht" }
