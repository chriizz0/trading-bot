name: Research EXP-201 (Intraday)
on:
  workflow_dispatch:
    inputs:
      from: { description: 'Startdatum', default: '2016-01-01' }
      probe: { description: 'Nur Probeabruf (1 Woche, ohne Auswertung)', type: boolean, default: false }
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - uses: actions/cache@v4
        with:
          path: data/intraday
          key: exp201-dukascopy-m30-v1-${{ hashFiles('config/exp201.json') }}
      - name: Dukascopy-Daten laden (30 Min, Bid + Ask)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/intraday reports
          exec > >(tee reports/exp201-fetch.log) 2>&1
          FROM="${{ inputs.from }}"; TO=$(date -u -d "yesterday" +%F)
          if [ "${{ inputs.probe }}" = "true" ]; then FROM=2024-03-04; TO=2024-03-08; rm -f data/intraday/*.csv; fi
          for pair in US500:usa500idxusd US100:usatechidxusd DE40:deuidxeur; do
            name=${pair%%:*}; id=${pair##*:}
            for side in bid ask; do
              [ -s "data/intraday/$name-$side.csv" ] && continue
              npx --yes dukascopy-node@1 -s -i "$id" -from "$FROM" -to "$TO" -t m30 -p "$side" \
                -f csv -dir data/intraday -fn "$name-$side" -bs 3 -bp 1500 -r 10 -rp 5000 -re
              f=$(ls data/intraday/$name-$side* | head -1); [ "$f" = "data/intraday/$name-$side.csv" ] || mv "$f" "data/intraday/$name-$side.csv"
              ls -la data/intraday; wc -l "data/intraday/$name-$side.csv"; head -2 "data/intraday/$name-$side.csv"
            done
          done
      - if: ${{ !inputs.probe }}
        run: python scripts/research_intraday.py 2>&1 | tee -a reports/exp201-fetch.log
        shell: bash
      - if: always()
        run: bash .github/workflows/_commit.sh reports
        env: { COMMIT_MSG: "research: EXP-201 Ergebnis" }
