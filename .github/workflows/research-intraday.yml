name: Research EXP-201 (Intraday)
on:
  workflow_dispatch:
    inputs:
      from: { description: 'Startdatum', default: '2016-01-01' }
      probe: { description: 'Nur Probeabruf (1 Woche, ohne Auswertung)', type: boolean, default: false }
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - uses: actions/cache@v4
        with:
          path: data/intraday
          key: exp201-dukascopy-bi5-v2-${{ hashFiles('config/exp201.json') }}
      - name: Dukascopy-Daten laden (bi5, 1 Min -> 30 Min, Bid + Ask)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scripts/fetch_dukascopy.py --from 2024-02-05 --to 2024-02-09 --out /tmp/probe 2>&1 | tee reports/exp201-fetch.log
          else
            python scripts/fetch_dukascopy.py --from "${{ inputs.from }}" 2>&1 | tee reports/exp201-fetch.log
          fi
      - if: ${{ !inputs.probe }}
        run: python scripts/research_intraday.py 2>&1 | tee -a reports/exp201-fetch.log
        shell: bash
      - if: always()
        run: bash .github/workflows/_commit.sh reports
        env: { COMMIT_MSG: "research: EXP-201 Ergebnis" }
