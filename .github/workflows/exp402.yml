name: EXP-402 Nachrichten-Reaktion
on:
  schedule:
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false
concurrency:
  group: repo-write
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - if: ${{ inputs.debug }}
        run: python scripts/exp402.py debug
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODELS: ${{ vars.ANTHROPIC_MODELS || 'claude-haiku-5-5,claude-sonnet-5-5' }}
      - if: ${{ !inputs.debug }}
        run: python scripts/exp402.py predict
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODELS: ${{ vars.ANTHROPIC_MODELS || 'claude-haiku-5-5,claude-sonnet-5-5' }}
      - if: always()
        run: python scripts/exp402.py score
      - if: always()
        run: python scripts/dashboard.py
      - if: always()
        run: bash .github/workflows/_commit.sh predictions/exp402 reports/exp402 docs
        env:
          COMMIT_MSG: "exp402: Nachrichten-Signale und Auswertung"
